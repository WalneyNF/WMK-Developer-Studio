name: WMK Windows Release (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

# Não cancelar builds longos quando novos commits chegam ao mesmo branch.
# A compilação Rust inicial pode levar bastante tempo.
jobs:
  windows-x64:
    name: Windows x64 - Instalador e Portátil
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: wmk-windows-x64-v1
          cache-on-failure: true

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificar frontend
        run: pnpm build

      - name: Registrar inicio do build
        shell: pwsh
        run: |
          "Release iniciada: $(Get-Date -Format o)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Compilar instalador Tauri
        run: pnpm exec tauri build --ci --target x86_64-pc-windows-msvc --bundles nsis

      - name: Empacotar instalador e versao portatil
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "wmk-dist" | Out-Null
          $exe = "target/x86_64-pc-windows-msvc/release/openidea.exe"
          if (!(Test-Path $exe)) { throw "Executavel nao encontrado: $exe" }
          Copy-Item $exe "wmk-dist/WMK-Developer-Studio.exe"
          $installers = Get-ChildItem "target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue
          if (!$installers) { throw "Instalador NSIS nao gerado" }
          foreach ($i in $installers) {
            Copy-Item $i.FullName ("wmk-dist/WMK-Developer-Studio-Setup-" + $i.Name)
          }
          Get-ChildItem "wmk-dist" -File | ForEach-Object {
            $sha = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$sha  $($_.Name)" | Out-File -FilePath ($_.FullName + ".sha256") -Encoding ascii
          }

      - name: Relatorio de artefatos
        if: success()
        shell: pwsh
        run: |
          "## WMK Windows Release" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-ChildItem "wmk-dist" -File | ForEach-Object {
            $mb = [math]::Round($_.Length / 1MB, 2)
            "- $($_.Name) ($mb MB)" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Resumo do build (inclusive falhas)
        if: always()
        shell: pwsh
        run: |
          "## Diagnostico WMK" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Workflow: ${{ github.workflow }}" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Commit: ${{ github.sha }}" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Resultado ate o resumo: ${{ job.status }}" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Caso falhe, abra a etapa vermelha e localize a primeira mensagem de erro." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Disponibilizar downloads
        uses: actions/upload-artifact@v4
        with:
          name: WMK-Developer-Studio-Windows-x64
          path: wmk-dist/*
          if-no-files-found: error
          retention-days: 30
